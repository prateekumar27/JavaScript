    //event propogation = means bubling up, goes from down to up flow image >li > ul tracking of an elemt from inside to outside
    //event bubling = false

    document.getElementById("image").addEventListener(
      "click",
      function (e) {

      "click",
      function (e) {
        console.log("nose clicked");
        e.stopPropagation() //it will stop bubbling
